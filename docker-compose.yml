version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: esp32-mosquitto
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    networks:
      - esp-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esp32-backend
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
    networks:
      - esp-network
    volumes:
      - ./backend:/app
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1884
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esp32-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - esp-network
    restart: unless-stopped

networks:
  esp-network:
    driver: bridge